<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Idea Map</title>
<style>
:root{--head:58px;--compose:76px;--violet:#7c3aed;--slate:#475569}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1e293b;background:#f8fafc}button,input,select{font:inherit}button{border:0;cursor:pointer}header{height:var(--head);background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:relative;z-index:100}.brand{display:flex;align-items:center;gap:9px;min-width:0}.logo{width:36px;height:36px;flex:none;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#4f46e5);display:grid;place-items:center;color:#fff}.brand b{display:block}.brand small{display:block;color:#94a3b8;font-size:10px}.actions{display:flex;align-items:center;gap:5px}.btn{background:#f1f5f9;color:#475569;border-radius:10px;padding:8px 10px}.danger{background:#fff1f2;color:#be123c}.cloud{display:flex;align-items:center;gap:5px;font-size:11px;color:#64748b}.dot{width:8px;height:8px;border-radius:50%;background:#94a3b8}.dot.saved{background:#22c55e}.dot.saving{background:#f59e0b}.dot.error{background:#ef4444}.app{height:calc(100dvh - var(--head));display:flex;min-height:0}.sidebar{width:238px;flex:none;background:#fff;border-right:1px solid #e2e8f0;padding:15px;display:flex;flex-direction:column;gap:18px}.label{font-size:10px;font-weight:800;color:#94a3b8;letter-spacing:.09em;margin-bottom:7px}.field{width:100%;padding:10px 11px;background:#f1f5f9;border:0;border-radius:10px;outline:none}.help{font-size:11px;line-height:1.55;color:#64748b}.workspace{position:relative;flex:1;min-width:0;min-height:0}.viewport{position:absolute;inset:0 0 var(--compose) 0;overflow:auto;overscroll-behavior:contain;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;background-color:#fafbff;background-image:radial-gradient(#cbd5e1 1px,transparent 1px);background-size:24px 24px}.world{position:relative;width:1800px;height:1200px}.edges{position:absolute;left:0;top:0;width:1800px;height:1200px;z-index:1;pointer-events:none}.node{position:absolute;width:200px;min-height:84px;border:2px solid;border-radius:16px;padding:11px;box-shadow:0 4px 12px #0f172a17;z-index:2;touch-action:none;user-select:none;cursor:grab}.node.selected{outline:4px solid #ddd6fe;box-shadow:0 12px 28px #0f172a2a}.node-title{font-weight:750;font-size:14px;line-height:1.4;overflow-wrap:anywhere}.node-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:5px;margin-top:10px}.tag{font-size:10px;background:#ffffffb8;padding:3px 7px;border-radius:999px}.node-actions{display:flex;gap:3px;opacity:.4}.node.selected .node-actions{opacity:1}.icon{width:29px;height:29px;border-radius:8px;background:#ffffffc9;color:inherit}.icon:hover{background:#fff}.composer{position:absolute;left:0;right:0;bottom:0;height:var(--compose);padding:10px max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:#fffffff2;border-top:1px solid #e2e8f0;z-index:90;display:flex;align-items:center}.compose{width:min(760px,100%);margin:auto;display:flex;gap:7px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:15px;padding:7px}.compose input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:0 7px;font-size:16px}.send{width:42px;height:42px;flex:none;border-radius:11px;background:var(--violet);color:#fff;font-size:18px}.banner,.toast{position:absolute;left:50%;transform:translateX(-50%);z-index:110;background:#0f172a;color:#fff;border-radius:999px;padding:9px 14px;font-size:12px;box-shadow:0 8px 25px #0f172a35;display:none;text-align:center}.banner{top:10px}.toast{bottom:calc(var(--compose) + 10px)}.mobile-menu{display:none;position:absolute;right:8px;top:8px;z-index:120;background:#fff;border:1px solid #e2e8f0;border-radius:14px;box-shadow:0 14px 30px #0f172a30;padding:10px;width:210px}.mobile-menu select,.mobile-menu input{margin:4px 0 10px}.auth{position:fixed;inset:0;z-index:999;background:linear-gradient(135deg,#f5f3ff,#eff6ff);display:grid;place-items:center;padding:20px}.auth-card{width:min(410px,100%);background:#fff;border:1px solid #e2e8f0;border-radius:21px;padding:26px;box-shadow:0 25px 60px #312e8135}.auth-card h2{margin:14px 0 7px}.auth-card p{font-size:12px;color:#64748b;line-height:1.6}.auth-card input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:11px;margin:5px 0;outline:none}.login{width:100%;padding:12px;background:var(--violet);color:#fff;border-radius:11px;font-weight:700;margin-top:8px}.auth-error{color:#dc2626;font-size:12px;min-height:18px;margin-top:8px}.hidden{display:none!important}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat{border-radius:13px;padding:10px;background:#f5f3ff;color:#6d28d9}.stat:nth-child(2){background:#eff6ff;color:#1d4ed8}.stat strong{display:block;font-size:21px}
@media(max-width:800px){:root{--head:54px;--compose:72px}.sidebar{display:none}.brand small{display:none}.brand b{font-size:14px}.logo{width:33px;height:33px}.cloud{display:none}.desktop-only{display:none}.btn{padding:7px 8px;font-size:12px}.node{width:170px;min-height:76px;padding:9px}.node-actions{opacity:1}.icon{width:31px;height:31px}.banner{width:calc(100% - 20px);border-radius:13px}.mobile-menu{display:none}.mobile-menu.open{display:block}}
</style>
</head>
<body>
<div class="auth" id="auth"><div class="auth-card"><div class="logo">💡</div><h2>Idea Mapにログイン</h2><p>SupabaseのAuthenticationで作成したメールアドレスとパスワードを入力してください。</p><input id="email" type="email" autocomplete="email" placeholder="メールアドレス"><input id="password" type="password" autocomplete="current-password" placeholder="パスワード"><button class="login" id="login">ログイン</button><div class="auth-error" id="authError"></div></div></div>
<header><div class="brand"><div class="logo">💡</div><div><b>Idea Map</b><small>思考を置いて、つないで、育てる</small></div></div><div class="actions"><div class="cloud"><span class="dot" id="dot"></span><span id="status">接続確認中</span></div><button class="btn desktop-only" id="center">全体表示</button><button class="btn desktop-only" id="download">保存</button><button class="btn" id="menuBtn">設定</button><button class="btn danger" id="logout">退出</button></div></header>
<div class="app"><aside class="sidebar"><div><div class="label">検索</div><input class="field" id="search" placeholder="アイデアを検索"></div><div><div class="label">矢印の意味</div><select class="field relation"><option>関連</option><option>具体化</option><option>原因</option><option>結果</option><option>対象</option><option>反対</option><option>派生</option></select><p class="help">①接続元カードの🔗を押す<br>②接続先カードを押す<br>③カードの縁から矢印が表示されます</p></div><div><div class="label">マップ情報</div><div class="stats"><div class="stat"><strong id="nodeCount">0</strong>カード</div><div class="stat"><strong id="edgeCount">0</strong>矢印</div></div></div><p class="help" style="margin-top:auto">空白部分をドラッグまたはスワイプすると、広いマップ内を移動できます。カード自体を動かすと位置を変更できます。</p></aside><main class="workspace"><div class="viewport" id="viewport"><div class="world" id="world"><svg class="edges"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs><g id="lines"></g></svg></div></div><div class="banner" id="banner">接続先のカードを選んでください</div><div class="toast" id="toast"></div><div class="mobile-menu" id="mobileMenu"><div class="label">検索</div><input class="field" id="mobileSearch" placeholder="アイデアを検索"><div class="label">矢印の意味</div><select class="field relation"><option>関連</option><option>具体化</option><option>原因</option><option>結果</option><option>対象</option><option>反対</option><option>派生</option></select><button class="btn" style="width:100%;margin-bottom:6px" id="mobileCenter">全体表示</button><button class="btn" style="width:100%;margin-bottom:6px" id="mobileDownload">データ保存</button><button class="btn danger" style="width:100%" id="reset">初期化</button></div><div class="composer"><div class="compose"><input id="ideaInput" placeholder="アイデアを入力…"><button class="send" id="add">➤</button></div></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://nsdbxvnfnjzaytrttgob.supabase.co';
const SUPABASE_KEY='sb_publishable_4Z1xlmmYhu33jzTQbgqlew_-a64jiwY';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const COLORS=[['#dbeafe','#60a5fa','#1e3a8a'],['#ede9fe','#a78bfa','#4c1d95'],['#dcfce7','#4ade80','#14532d'],['#fef3c7','#fbbf24','#78350f'],['#fce7f3','#f472b6','#831843'],['#ffedd5','#fb923c','#7c2d12']];
const SAMPLE_NODES=[{id:'n1',text:'新しいサービス',x:500,y:210,color:1,category:'テーマ'},{id:'n2',text:'学生向け',x:210,y:410,color:0,category:'対象'},{id:'n3',text:'気軽に使える',x:510,y:480,color:2,category:'価値'},{id:'n4',text:'スマホ対応',x:800,y:390,color:3,category:'具体化'}];
const SAMPLE_EDGES=[{id:'e1',from:'n1',to:'n2',label:'対象'},{id:'e2',from:'n1',to:'n3',label:'関連'},{id:'e3',from:'n3',to:'n4',label:'具体化'}];
let local;try{local=JSON.parse(localStorage.getItem('idea-map-standalone'))}catch(_){}let nodes=local?.nodes||structuredClone(SAMPLE_NODES),edges=local?.edges||structuredClone(SAMPLE_EDGES),user=null,cloudReady=false,selected=null,connectFrom=null,drag=null,saveTimer=null,suppressClick=false;
const $=s=>document.querySelector(s),viewport=$('#viewport'),world=$('#world'),lines=$('#lines'),ideaInput=$('#ideaInput');const uid=p=>p+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,6);const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function relation(){return document.querySelector('.relation').value}document.querySelectorAll('.relation').forEach(x=>x.onchange=()=>document.querySelectorAll('.relation').forEach(y=>y.value=x.value));
function cloud(text,state=''){ $('#status').textContent=text;$('#dot').className='dot '+state }
function flash(t){const x=$('#toast');x.textContent=t;x.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>x.style.display='none',1600)}
function persist(){localStorage.setItem('idea-map-standalone',JSON.stringify({nodes,edges}));if(!user||!cloudReady)return;clearTimeout(saveTimer);cloud('保存中…','saving');saveTimer=setTimeout(saveCloud,700)}
async function saveCloud(){const {error}=await db.from('idea_maps').upsert({user_id:user.id,nodes,edges,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error){console.error(error);cloud('保存失敗','error');flash('クラウド保存に失敗しました')}else cloud('保存済み','saved')}
async function loadCloud(){cloud('読込中…','saving');const {data,error}=await db.from('idea_maps').select('nodes,edges').eq('user_id',user.id).maybeSingle();if(error){console.error(error);cloud('読込失敗','error');cloudReady=true;render();return}if(data){nodes=data.nodes||[];edges=data.edges||[]}cloudReady=true;render();if(!data)await saveCloud();else cloud('保存済み','saved');setTimeout(centerMap,100)}
async function showSession(session){if(session?.user){user=session.user;$('#auth').classList.add('hidden');await loadCloud()}else{user=null;cloudReady=false;$('#auth').classList.remove('hidden');cloud('未ログイン')}}
async function login(){const btn=$('#login'),box=$('#authError');box.textContent='';btn.disabled=true;btn.textContent='ログイン中…';const {data,error}=await db.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});btn.disabled=false;btn.textContent='ログイン';if(error){box.textContent='ログインできません。メールアドレスとパスワードを確認してください。';return}await showSession(data.session)}
function edgePoint(a,b,start){const w=innerWidth<=800?170:200,h=84,ax=a.x+w/2,ay=a.y+h/2,bx=b.x+w/2,by=b.y+h/2,dx=bx-ax,dy=by-ay;const t=Math.min((w/2+4)/Math.max(Math.abs(dx),.01),(h/2+4)/Math.max(Math.abs(dy),.01));return start?{x:ax+dx*t,y:ay+dy*t}:{x:bx-dx*t,y:by-dy*t}}
function drawEdges(){lines.innerHTML='';edges.forEach(e=>{const a=nodes.find(n=>n.id===e.from),b=nodes.find(n=>n.id===e.to);if(!a||!b)return;const s=edgePoint(a,b,true),t=edgePoint(a,b,false),mx=(s.x+t.x)/2,my=(s.y+t.y)/2;lines.insertAdjacentHTML('beforeend',`<path d="M${s.x} ${s.y} C${mx} ${s.y},${mx} ${t.y},${t.x} ${t.y}" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><rect x="${mx-31}" y="${my-12}" width="62" height="24" rx="12" fill="white" stroke="#cbd5e1"/><text x="${mx}" y="${my+4}" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">${esc(e.label)}</text>`)});}
function render(){world.querySelectorAll('.node').forEach(x=>x.remove());const q=($('#search').value||$('#mobileSearch').value||'').toLowerCase();nodes.forEach(n=>{const c=COLORS[n.color%COLORS.length],el=document.createElement('div');el.className='node'+(selected===n.id?' selected':'');el.style.cssText=`left:${n.x}px;top:${n.y}px;background:${c[0]};border-color:${c[1]};color:${c[2]};opacity:${q&&!((n.text+n.category).toLowerCase().includes(q))?.18:1}`;el.innerHTML=`<div class="node-title">💡 ${esc(n.text)}</div><div class="node-foot"><span class="tag">${esc(n.category)}</span><div class="node-actions"><button class="icon edit" title="編集">✎</button><button class="icon link" title="矢印でつなぐ">🔗</button><button class="icon del" title="削除">×</button></div></div>`;el.onpointerdown=e=>startDrag(e,n,el);el.onclick=e=>nodeClick(e,n.id);el.querySelector('.edit').onclick=e=>{e.stopPropagation();editNode(n.id)};el.querySelector('.link').onclick=e=>{e.stopPropagation();connectFrom=n.id;selected=n.id;$('#banner').style.display='block';render()};el.querySelector('.del').onclick=e=>{e.stopPropagation();removeNode(n.id)};world.appendChild(el)});drawEdges();$('#nodeCount').textContent=nodes.length;$('#edgeCount').textContent=edges.length;persist()}
function startDrag(e,n,el){if(e.target.tagName==='BUTTON')return;e.preventDefault();e.stopPropagation();selected=n.id;const r=world.getBoundingClientRect();drag={id:n.id,dx:e.clientX-r.left-n.x,dy:e.clientY-r.top-n.y,sx:e.clientX,sy:e.clientY,moved:false};try{el.setPointerCapture(e.pointerId)}catch(_){}render()}
addEventListener('pointermove',e=>{if(!drag)return;const n=nodes.find(x=>x.id===drag.id),r=world.getBoundingClientRect();if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>6)drag.moved=true;n.x=Math.max(5,Math.min(1595,e.clientX-r.left-drag.dx));n.y=Math.max(5,Math.min(1105,e.clientY-r.top-drag.dy));suppressClick=drag.moved;render()},{passive:false});addEventListener('pointerup',()=>{if(drag?.moved)setTimeout(()=>suppressClick=false,80);drag=null});
function nodeClick(e,id){e.stopPropagation();if(suppressClick)return;if(connectFrom&&connectFrom!==id){if(!edges.some(x=>x.from===connectFrom&&x.to===id))edges.push({id:uid('e'),from:connectFrom,to:id,label:relation()});connectFrom=null;$('#banner').style.display='none';flash('矢印を追加しました')}selected=id;render()}
function editNode(id){const n=nodes.find(x=>x.id===id),v=prompt('アイデアを編集',n.text);if(v?.trim()){n.text=v.trim();render()}}
function removeNode(id){if(!confirm('このカードを削除しますか？'))return;nodes=nodes.filter(n=>n.id!==id);edges=edges.filter(e=>e.from!==id&&e.to!==id);selected=null;render()}
function addIdea(){const t=ideaInput.value.trim();if(!t)return;const x=viewport.scrollLeft+Math.max(25,Math.min(viewport.clientWidth-190,70)),y=viewport.scrollTop+Math.max(25,Math.min(viewport.clientHeight-110,70));const n={id:uid('n'),text:t,x,y,color:nodes.length%COLORS.length,category:'アイデア'};nodes.push(n);ideaInput.value='';selected=n.id;render();flash('カードを追加しました')}
function centerMap(){if(!nodes.length){viewport.scrollTo(0,0);return}const minX=Math.min(...nodes.map(n=>n.x)),maxX=Math.max(...nodes.map(n=>n.x+200)),minY=Math.min(...nodes.map(n=>n.y)),maxY=Math.max(...nodes.map(n=>n.y+84));viewport.scrollTo({left:Math.max(0,(minX+maxX-viewport.clientWidth)/2),top:Math.max(0,(minY+maxY-viewport.clientHeight)/2),behavior:'smooth'})}
function download(){const a=document.createElement('a'),blob=new Blob([JSON.stringify({nodes,edges},null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='idea-map-data.json';a.click();URL.revokeObjectURL(a.href)}
$('#add').onclick=addIdea;ideaInput.onkeydown=e=>{if(e.key==='Enter')addIdea()};$('#login').onclick=login;$('#password').onkeydown=e=>{if(e.key==='Enter')login()};$('#logout').onclick=async()=>{await db.auth.signOut();location.reload()};$('#download').onclick=download;$('#mobileDownload').onclick=download;$('#center').onclick=centerMap;$('#mobileCenter').onclick=()=>{centerMap();$('#mobileMenu').classList.remove('open')};$('#menuBtn').onclick=e=>{e.stopPropagation();$('#mobileMenu').classList.toggle('open')};$('#search').oninput=e=>{$('#mobileSearch').value=e.target.value;render()};$('#mobileSearch').oninput=e=>{$('#search').value=e.target.value;render()};$('#reset').onclick=()=>{if(confirm('すべてのカードと矢印をサンプル状態に戻しますか？')){nodes=structuredClone(SAMPLE_NODES);edges=structuredClone(SAMPLE_EDGES);render();centerMap()}};viewport.onclick=e=>{if(e.target===viewport||e.target===world||e.target.closest('svg')){selected=null;connectFrom=null;$('#banner').style.display='none';render()}};document.onclick=()=>$('#mobileMenu').classList.remove('open');$('#mobileMenu').onclick=e=>e.stopPropagation();
db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT')showSession(null)});render();db.auth.getSession().then(({data})=>showSession(data.session));
</script>
</body></html>
