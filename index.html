<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Idea Map</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1e293b;background:#f8fafc;overflow:hidden}
header{height:64px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;box-shadow:0 1px 8px #0f172a0a}.brand{display:flex;align-items:center;gap:12px}.logo{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,#7c3aed,#4f46e5);display:grid;place-items:center;color:#fff;font-size:22px}.brand b{display:block}.brand small{color:#94a3b8}.actions{display:flex;gap:8px}button,select,input{font:inherit}button{border:0;cursor:pointer}.topbtn{padding:9px 13px;border-radius:11px;background:#f1f5f9;color:#475569}.topbtn:hover{background:#e2e8f0}.layout{display:flex;height:calc(100vh - 64px)}aside{width:250px;background:#fff;border-right:1px solid #e2e8f0;padding:18px;display:flex;flex-direction:column;gap:20px}.label{font-size:11px;font-weight:700;color:#94a3b8;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}.field{width:100%;padding:10px 12px;border:0;outline:0;background:#f1f5f9;border-radius:11px}.help{font-size:12px;line-height:1.6;color:#94a3b8}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:12px;border-radius:14px;background:#f5f3ff;color:#6d28d9}.stat:nth-child(2){background:#eff6ff;color:#1d4ed8}.stat strong{font-size:23px;display:block}.board-wrap{position:relative;flex:1;min-width:0}.board{position:absolute;inset:0 0 88px 0;overflow:hidden;background-color:#fafbff;background-image:radial-gradient(#cbd5e1 1.2px,transparent 1.2px);background-size:24px 24px}.connections{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.node{position:absolute;width:200px;min-height:82px;border:2px solid;border-radius:16px;padding:12px;box-shadow:0 3px 10px #0f172a12;cursor:grab;user-select:none}.node.selected{outline:4px solid #ddd6fe;box-shadow:0 10px 25px #0f172a22}.node .text{font-weight:700;font-size:14px;line-height:1.45;padding-right:5px}.node .bottom{display:flex;justify-content:space-between;align-items:center;margin-top:13px}.tag{font-size:10px;background:#ffffffaa;padding:3px 8px;border-radius:999px}.node-actions{display:none;gap:4px}.node.selected .node-actions{display:flex}.iconbtn{width:27px;height:27px;border-radius:8px;background:#ffffffbb}.iconbtn:hover{background:white}.composer{position:absolute;left:0;right:0;bottom:0;height:88px;background:#ffffffed;backdrop-filter:blur(10px);border-top:1px solid #e2e8f0;display:flex;align-items:center;padding:14px 28px}.compose-inner{max-width:760px;width:100%;margin:auto;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:16px;padding:8px;display:flex;gap:8px}.compose-inner input{flex:1;border:0;background:transparent;outline:0;padding:0 8px}.send{width:42px;height:42px;border-radius:12px;background:#7c3aed;color:#fff;font-size:18px}.connect-banner{display:none;position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:50;background:#0f172a;color:#fff;border-radius:999px;padding:9px 15px;font-size:13px}.toast{display:none;position:absolute;bottom:105px;left:50%;transform:translateX(-50%);z-index:60;background:#0f172a;color:#fff;border-radius:999px;padding:9px 15px;font-size:13px}@media(max-width:800px){aside{display:none}.actions .optional{display:none}.composer{padding:12px}.node{width:170px}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">💡</div><div><b>Idea Map</b><small>思考を置いて、つないで、育てる</small></div></div><div class="actions"><button class="topbtn optional" id="arrange">自動整列</button><button class="topbtn" id="download">保存</button><button class="topbtn" id="reset">リセット</button></div></header>
<div class="layout">
<aside>
<div><div class="label">検索</div><input class="field" id="search" placeholder="アイデアを検索"></div>
<div><div class="label">つなぎ方</div><select class="field" id="relation"><option>関連</option><option>具体化</option><option>原因</option><option>結果</option><option>対象</option><option>反対</option><option>派生</option></select><p class="help">カードを選び「🔗」を押してから、つなぎ先をクリックします。</p></div>
<div><div class="label">マップ情報</div><div class="stats"><div class="stat"><strong id="nodeCount">0</strong>アイデア</div><div class="stat"><strong id="edgeCount">0</strong>つながり</div></div></div>
<div style="margin-top:auto;padding:15px;background:#0f172a;color:white;border-radius:16px"><b>✨ ひらめきのコツ</b><p class="help" style="color:#cbd5e1;margin-bottom:0">まずは質より量。短い言葉でどんどん置いてみよう。</p></div>
</aside>
<main class="board-wrap"><div class="board" id="board"><svg class="connections" id="svg"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs><g id="lines"></g></svg></div><div class="connect-banner" id="banner">つなぎ先のカードを選択してください</div><div class="toast" id="toast"></div><div class="composer"><div class="compose-inner"><input id="ideaInput" placeholder="思いついたことを入力… Enterで追加"><button class="send" id="add">➤</button></div></div></main>
</div>
<script>
const colors=[['#dbeafe','#60a5fa','#1e3a8a'],['#ede9fe','#a78bfa','#4c1d95'],['#dcfce7','#4ade80','#14532d'],['#fef3c7','#fbbf24','#78350f'],['#fce7f3','#f472b6','#831843'],['#ffedd5','#fb923c','#7c2d12']];
const initialNodes=[{id:'n1',text:'新しいサービス',x:390,y:100,color:1,category:'テーマ'},{id:'n2',text:'学生向け',x:100,y:280,color:0,category:'対象'},{id:'n3',text:'気軽に使える',x:390,y:330,color:2,category:'価値'},{id:'n4',text:'スマホ対応',x:670,y:250,color:3,category:'具体化'}];
const initialEdges=[{id:'e1',from:'n1',to:'n2',label:'対象'},{id:'e2',from:'n1',to:'n3',label:'特徴'},{id:'e3',from:'n3',to:'n4',label:'具体化'}];
let saved;try{saved=JSON.parse(localStorage.getItem('idea-map-standalone'))}catch(e){}let nodes=saved?.nodes||structuredClone(initialNodes),edges=saved?.edges||structuredClone(initialEdges),selected=null,connectFrom=null,drag=null;
const board=document.querySelector('#board'),lines=document.querySelector('#lines'),input=document.querySelector('#ideaInput');const uid=p=>p+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,6);
function persist(){localStorage.setItem('idea-map-standalone',JSON.stringify({nodes,edges}))}function flash(t){let x=document.querySelector('#toast');x.textContent=t;x.style.display='block';clearTimeout(window.ft);window.ft=setTimeout(()=>x.style.display='none',1500)}
function render(){document.querySelectorAll('.node').forEach(n=>n.remove());const q=document.querySelector('#search').value.toLowerCase();nodes.forEach(n=>{let c=colors[n.color%colors.length],el=document.createElement('div');el.className='node'+(selected===n.id?' selected':'');el.dataset.id=n.id;el.style.cssText=`left:${n.x}px;top:${n.y}px;background:${c[0]};border-color:${c[1]};color:${c[2]};opacity:${q&&!((n.text+n.category).toLowerCase().includes(q))?.2:1}`;el.innerHTML=`<div class="text">💡 ${escapeHtml(n.text)}</div><div class="bottom"><span class="tag">${escapeHtml(n.category)}</span><div class="node-actions"><button class="iconbtn edit">✎</button><button class="iconbtn link">🔗</button><button class="iconbtn del">×</button></div></div>`;el.onmousedown=e=>startDrag(e,n);el.onclick=e=>nodeClick(e,n.id);el.ondblclick=e=>{e.stopPropagation();editNode(n.id)};el.querySelector('.edit').onclick=e=>{e.stopPropagation();editNode(n.id)};el.querySelector('.link').onclick=e=>{e.stopPropagation();connectFrom=n.id;document.querySelector('#banner').style.display='block';render()};el.querySelector('.del').onclick=e=>{e.stopPropagation();removeNode(n.id)};board.appendChild(el)});draw();document.querySelector('#nodeCount').textContent=nodes.length;document.querySelector('#edgeCount').textContent=edges.length;persist()}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function nodeClick(e,id){e.stopPropagation();if(connectFrom&&connectFrom!==id){if(!edges.some(x=>x.from===connectFrom&&x.to===id))edges.push({id:uid('e'),from:connectFrom,to:id,label:document.querySelector('#relation').value});connectFrom=null;document.querySelector('#banner').style.display='none';flash('アイデアをつなぎました')}selected=id;render()}
function startDrag(e,n){if(e.target.tagName==='BUTTON')return;e.preventDefault();e.stopPropagation();selected=n.id;let r=board.getBoundingClientRect();drag={id:n.id,dx:e.clientX-r.left-n.x,dy:e.clientY-r.top-n.y};render()}window.onmousemove=e=>{if(!drag)return;let r=board.getBoundingClientRect(),n=nodes.find(x=>x.id===drag.id);n.x=Math.max(5,Math.min(r.width-205,e.clientX-r.left-drag.dx));n.y=Math.max(5,Math.min(r.height-88,e.clientY-r.top-drag.dy));render()};window.onmouseup=()=>drag=null;
function draw(){lines.innerHTML='';edges.forEach(ed=>{let a=nodes.find(n=>n.id===ed.from),b=nodes.find(n=>n.id===ed.to);if(!a||!b)return;let x1=a.x+100,y1=a.y+41,x2=b.x+100,y2=b.y+41,m=(x1+x2)/2;lines.insertAdjacentHTML('beforeend',`<path d="M${x1} ${y1} C${m} ${y1},${m} ${y2},${x2} ${y2}" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="${m-27}" y="${(y1+y2)/2-11}" width="54" height="22" rx="11" fill="white" stroke="#e2e8f0"/><text x="${m}" y="${(y1+y2)/2+4}" text-anchor="middle" font-size="10" fill="#64748b">${escapeHtml(ed.label)}</text>`)});}
function addIdea(){let t=input.value.trim();if(!t)return;let r=board.getBoundingClientRect(),i=nodes.length;nodes.push({id:uid('n'),text:t,x:Math.max(10,Math.min(r.width-210,220+(i*83)%500)),y:Math.max(10,Math.min(r.height-90,80+(i*67)%350)),color:i%colors.length,category:'アイデア'});input.value='';selected=nodes.at(-1).id;render();flash('アイデアを追加しました')}function removeNode(id){nodes=nodes.filter(n=>n.id!==id);edges=edges.filter(e=>e.from!==id&&e.to!==id);selected=null;render()}function editNode(id){let n=nodes.find(x=>x.id===id),v=prompt('アイデアを編集',n.text);if(v&&v.trim()){n.text=v.trim();render()}}
document.querySelector('#add').onclick=addIdea;input.onkeydown=e=>{if(e.key==='Enter')addIdea()};board.onclick=()=>{selected=null;connectFrom=null;document.querySelector('#banner').style.display='none';render()};document.querySelector('#search').oninput=render;document.querySelector('#reset').onclick=()=>{if(confirm('サンプル状態に戻しますか？')){nodes=structuredClone(initialNodes);edges=structuredClone(initialEdges);selected=null;render()}};document.querySelector('#arrange').onclick=()=>{let r=board.getBoundingClientRect();nodes.forEach((n,i)=>{let a=(i/Math.max(nodes.length,1))*Math.PI*2;n.x=r.width/2-100+Math.cos(a)*Math.min(r.width*.32,300);n.y=r.height/2-40+Math.sin(a)*Math.min(r.height*.3,190)});render()};document.querySelector('#download').onclick=()=>{let blob=new Blob([JSON.stringify({nodes,edges},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='idea-map-data.json';a.click();URL.revokeObjectURL(a.href)};render();
</script>
</body></html>
